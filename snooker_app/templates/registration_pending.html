{% extends 'base.html' %}
{% block content %}
<div class="container mt-5 text-center">
    <div class="card shadow p-5">
        <h2 class="text-primary">Verify your email 📧</h2>
        <p class="lead mt-3">We've sent an activation link to your email address.</p>
        <p>Please check your inbox (and spam folder) and click the link to activate your account.</p>
        <p class="text-muted small">The link is valid for 12 hours.</p>
        <a href="{% url 'home' %}" class="btn btn-outline-secondary mt-3">Back to Home</a>
    </div>
</div>
{% endblock %}
