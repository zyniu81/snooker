<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Snooker Scoreboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212; /* Deep dark background */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* No scrollbars */
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Top Bar: Timer, Frames, Remaining */
        .top-bar {
            background-color: #1e1e1e;
            padding: 15px 0;
            border-bottom: 2px solid #333;
            font-size: 1.5rem;
            font-weight: bold;
            color: #aaaaaa;
        }

        .highlight-text { color: #f1c40f; } /* Gold color for emphasis */

        /* Player Names */
        .player-name {
            font-size: 3rem;
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* The Main Scores */
        .score-display {
            font-size: 12rem; /* HUGE font */
            font-weight: 800;
            line-height: 1;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        /* Active Player Indicator (Dot or Border) */
        .active-marker {
            width: 20px;
            height: 20px;
            background-color: #e74c3c; /* Red dot */
            border-radius: 50%;
            display: inline-block;
            margin-left: 15px;
            opacity: 0; /* Hidden by default */
            transition: opacity 0.3s;
            box-shadow: 0 0 10px #e74c3c;
        }
        .active-marker.visible { opacity: 1; }

        /* Stats & Break Info */
        .stats-box {
            font-size: 1.8rem;
            min-height: 3rem;
            margin-top: 20px;
            font-weight: 500;
        }

        .current-break {
            color: #f1c40f; /* Gold */
            font-weight: bold;
            font-size: 2rem;
        }

        /* Frame Score (Middle) */
        .frame-score {
            font-size: 2.5rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container-fluid top-bar text-center">
        <div class="row">
            <div class="col-4 text-start ps-5">
                On Table: <span id="sb-remaining" class="text-white">147</span>
            </div>
            <div class="col-4">
                <span id="sb-frames-p1">0</span>
                <span class="mx-2" style="color: #888; font-weight: normal;">
                    (<span id="sb-total-frames">5</span>)
                </span>
                <span id="sb-frames-p2">0</span>
            </div>
            <div class="col-4 text-end pe-5">
                Time: <span id="sb-timer" class="highlight-text">00:00:00</span>
            </div>
        </div>
    </div>

    <div class="container-fluid flex-grow-1 d-flex align-items-center">
        <div class="row w-100 text-center">

            <div class="col-5 border-end border-secondary">
                <div class="player-name">
                    <span id="sb-name-p1">Player 1</span>
                    <span id="marker-p1" class="active-marker"></span>
                </div>
                <div id="sb-score-p1" class="score-display">0</div>

                <div class="stats-box">
                    <div id="sb-break-p1" style="display: none;">Break: <span class="current-break">0</span></div>
                    <div id="sb-info-p1" class="mt-2"></div>
                </div>
            </div>

            <div class="col-2 d-flex flex-column justify-content-center align-items-center">
                <h2 class="text-muted">VS</h2>
            </div>

            <div class="col-5 border-start border-secondary">
                <div class="player-name">
                    <span id="marker-p2" class="active-marker"></span>
                    <span id="sb-name-p2">Player 2</span>
                </div>
                <div id="sb-score-p2" class="score-display">0</div>

                <div class="stats-box">
                    <div id="sb-break-p2" style="display: none;">Break: <span class="current-break">0</span></div>
                    <div id="sb-info-p2" class="mt-2"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Open communication channel (Same name as in sender!)
        const channel = new BroadcastChannel('snooker_live_score');

        channel.onmessage = (event) => {
            const data = event.data;

            // 1. Update Match Info
            document.getElementById('sb-remaining').textContent = data.pointsOnTable;
            document.getElementById('sb-timer').textContent = data.timer;
            document.getElementById('sb-total-frames').textContent = data.totalFrames;

            // 2. Update Player 1
            document.getElementById('sb-name-p1').textContent = data.p1.name;
            document.getElementById('sb-score-p1').textContent = data.p1.score;
            document.getElementById('sb-frames-p1').textContent = data.p1.frames;

            // Marker
            const m1 = document.getElementById('marker-p1');
            if (data.activePlayer === 1) m1.classList.add('visible');
            else m1.classList.remove('visible');

            // Break
            const b1 = document.getElementById('sb-break-p1');
            if (data.activePlayer === 1 && data.currentBreak > 0) {
                b1.style.display = 'block';
                b1.querySelector('span').textContent = data.currentBreak;
            } else {
                b1.style.display = 'none';
            }

            // Stats (To Win / Snookers)
            const info1 = document.getElementById('sb-info-p1');
            if (data.isStatsVisible && data.p1.statsHTML) {
                info1.innerHTML = data.p1.statsHTML;
                // We boost the font size for the big screen here
                info1.style.fontSize = "0.6em";
            } else {
                info1.innerHTML = "";
            }

            // 3. Update Player 2
            document.getElementById('sb-name-p2').textContent = data.p2.name;
            document.getElementById('sb-score-p2').textContent = data.p2.score;
            document.getElementById('sb-frames-p2').textContent = data.p2.frames;

            // Marker
            const m2 = document.getElementById('marker-p2');
            if (data.activePlayer === 2) m2.classList.add('visible');
            else m2.classList.remove('visible');

            // Break
            const b2 = document.getElementById('sb-break-p2');
            if (data.activePlayer === 2 && data.currentBreak > 0) {
                b2.style.display = 'block';
                b2.querySelector('span').textContent = data.currentBreak;
            } else {
                b2.style.display = 'none';
            }

            // Stats
            const info2 = document.getElementById('sb-info-p2');
            if (data.isStatsVisible && data.p2.statsHTML) {
                info2.innerHTML = data.p2.statsHTML;
                info2.style.fontSize = "0.6em";
            } else {
                info2.innerHTML = "";
            }
        };

        document.addEventListener('dblclick', () => {
            if (!document.fullscreenElement) {
                // Turn on full screen
                document.documentElement.requestFullscreen().catch((err) => {
                    console.log(`Error enabling fullscreen: ${err.message}`);
                });
            } else {
                // Turn off full screen
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });
    </script>
</body>
</html>
