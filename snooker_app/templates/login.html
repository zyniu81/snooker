{% extends 'base.html' %}

{% block title %}Login - Snooker App{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="text-center mb-4">
                <h2 class="fw-bold">Welcome Back</h2>
                <p class="text-muted">Sign in to manage your matches</p>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{{ request.GET.next }}">

                        <div class="mb-3">
                            <label for="username" class="form-label fw-bold text-muted small">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" required placeholder="Enter your username">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-bold text-muted small">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" required placeholder="Enter your password">
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary fw-bold py-2">Sign In</button>
                        </div>
                    </form>
                </div>

                <div class="card-footer text-center bg-white border-top-0 pb-4">
                    <p class="text-muted small mb-2">Don't have an account yet?</p>
                    <a href="{% url 'register' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}"
                       class="text-decoration-none fw-bold text-primary">
                        Create an account
                    </a>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
