{% extends 'base.html' %}

{% block title %}Add New Player - Snooker App{% endblock %}

{% block content %}
<style>
    /* Styling dla formularza */
    .form-card input[type="text"],
    .form-card input[type="number"],
    .form-card input[type="file"], /* Dodane dla file input */
    .form-card select,
    .form-card textarea {
        display: block;
        width: 100%;
        padding: 0.375rem 0.75rem;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5;
        color: #212529;
        background-color: #fff;
        background-clip: padding-box;
        border: 1px solid #ced4da;
        border-radius: 0.375rem;
        transition: border-color .15s ease-in-out,box-shadow .15s ease-in-out;
    }

    .form-card input:focus, .form-card select:focus {
        border-color: #86b7fe;
        outline: 0;
        box-shadow: 0 0 0 0.25rem rgba(13,110,253,.25);
    }

    .form-card label {
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: #495057;
    }

    .form-card p {
        margin-bottom: 1.5rem;
    }
</style>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="card form-card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">
                        <h3 class="fw-bold">Create New Player</h3>
                        <p class="text-muted small">Add a new contender to your roster</p>
                    </div>

                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}

                        {{ form.as_p }}

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-success fw-bold py-2">
                                <i class="bi bi-person-plus-fill"></i> Add Player
                            </button>
                            <a href="{% url 'player_list' %}" class="btn btn-light text-muted border">
                                Cancel
                            </a>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
