<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Break</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 90%;
        }
        h1 { color: #dc3545; margin-bottom: 15px; font-size: 28px; }
        p { font-size: 18px; line-height: 1.6; color: #6c757d; margin-bottom: 30px; }
        .timer-box {
            background-color: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            color: #0d6efd;
            display: inline-block;
        }
        .icon { font-size: 60px; margin-bottom: 20px; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🛠️</div>
        <h1>Maintenance in Progress</h1>
        <p>
            We are currently updating the Snooker App to serve you better.<br>
            The system is temporarily unavailable.
        </p>

        {% if message %}
            <div class="timer-box">
                INFO: {{ message }}
            </div>
        {% endif %}
    </div>
</body>
</html>
