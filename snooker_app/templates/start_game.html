{% extends 'base.html' %}

{% block content %}
{% load static %}

<div class="container">
    <div class="container" data-frame-id="{{ frame.id }}" data-match-id="{{ match.id }}">
    <div class="row">
        <div class="col-md-4">
            <div class="d-flex flex-column align-items-start">
            <h4>{{ players.0.player }}</h4>
            <div class="mt-2">
                <input type="text" class="form-control mx-1 text-center player-score" data-player="1" value="0" readonly style="width: 80px;">
            </div>
            <button class="btn btn-outline-primary mt-2 set-active-player" data-player="1">Set as Active Player</button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="d-flex flex-column align-items-center">
                <div class="mt-5 d-flex justify-content-center">
                    <input type="text" class="form-control mx-1 text-center" value="{{ players.0.frames_won }}" readonly style="width: 80px;">
                    <input type="text" class="form-control mx-1 text-center" value="( {{ number_of_frames }} )" readonly style="width: 80px;">
                    <input type="text" class="form-control mx-1 text-center" value="{{ players.1.frames_won }}" readonly style="width: 80px;">
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="d-flex flex-column align-items-end">
            <h4>{{ players.1.player }}</h4>
            <div class="mt-2">
                <input type="text" class="form-control mx-1 text-center player-score" data-player="2" value="0" readonly style="width: 80px;">
            </div>
            <button class="btn btn-outline-primary mt-2 set-active-player" data-player="2">Set as Active Player</button>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-12 text-center">
            <div class="btn-group" role="group">
                <button class="btn btn-danger rounded-circle m-1"
                        onclick="updateScore(1, 'red')"
                        style="width: 60px; height: 60px;"
                        aria-label="Red"
                        data-type = "red"></button>
                <button class="btn rounded-circle color-ball m-1"
                        onclick="updateScore(2, 'color')"
                        style="width: 60px; height: 60px; background-color: #FFFF00; color: black;"
                        aria-label="Yellow"
                        data-type="yellow"></button>
                <button class="btn btn-success rounded-circle color-ball m-1"
                        onclick="updateScore(3, 'color')"
                        style="width: 60px; height: 60px;"
                        aria-label="Green"
                        data-type="green"></button>
                <button class="btn rounded-circle color-ball m-1"
                        onclick="updateScore(4, 'color')"
                        style="width: 60px; height: 60px; background-color: #8B4513; color: white;"
                        aria-label="Brown"
                        data-type="brown"></button>
                <button class="btn btn-primary rounded-circle color-ball m-1"
                        onclick="updateScore(5, 'color')"
                        style="width: 60px; height: 60px;"
                        aria-label="Blue"
                        data-type="blue"></button>
                <button class="btn rounded-circle color-ball m-1"
                        onclick="updateScore(6, 'color')"
                        style="width: 60px; height: 60px; background-color: #FFC0CB;"
                        aria-label="Pink"
                        data-type="pink"></button>
                <button class="btn btn-dark rounded-circle color-ball m-1"
                        onclick="updateScore(7, 'color')"
                        style="width: 60px; height: 60px;"
                        aria-label="Black"
                        data-type="black"></button>
            </div>
        </div>
    </div>

    <div class="row mt-2">
        <div class="col-md-12 text-center">
            <div class="btn-group" role="group">
                <button class="btn btn-outline-danger me-2" onclick="miss()" title="Miss shot">
                    <i class="bi bi-x-circle"></i> Miss
                </button>
                <button class="btn btn-outline-success me-2" onclick="safetyShot()" title="Safety shot">
                    <i class="bi bi-shield"></i> Safety
                </button>
                <button class="btn btn-outline-warning me-2" onclick="showFoulModal()" title="Call a foul">
                    <i class="bi bi-exclamation-triangle"></i> Foul
                </button>
                <button class="btn btn-outline-secondary me-2" id="undoButton" title="Undo last action">
                    <i class="bi bi-arrow-counterclockwise"></i> Undo
                </button>
                <button class="btn btn-outline-primary" id="redoButton" title="Redo last action">
                    <i class="bi bi-arrow-clockwise"></i> Redo
                </button>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-12 text-center">
            <h5>On Table: <span id="points-on-table">147</span></h5>
            <div class="mt-4 d-flex justify-content-center align-items-center" style="gap: 10px;">
                <div class="d-flex align-items-center" style="gap: 5px;">
                    <div class="rounded-circle" style="width: 25px; height: 25px; background-color: red;">
                        <span id="red-ball-count" class="red-ball-count">15</span>
                    </div>
                    <div class="d-flex align-items-center" style="gap: 5px;">
                        <div class="rounded-circle color-ball-marker"
                             style="width: 25px; height: 25px; background-color: yellow;"
                             aria-label="Yellow"
                             data-type="yellow"></div>
                        <div class="rounded-circle color-ball-marker"
                             style="width: 25px; height: 25px; background-color: green;"
                             aria-label="Green"
                             data-type="green"></div>
                        <div class="rounded-circle color-ball-marker"
                             style="width: 25px; height: 25px; background-color: brown;"
                             aria-label="Brown"
                             data-type="brown"></div>
                        <div class="rounded-circle color-ball-marker"
                             style="width: 25px; height: 25px; background-color: blue;"
                             aria-label="Blue"
                             data-type="blue"></div>
                        <div class="rounded-circle color-ball-marker"
                             style="width: 25px; height: 25px; background-color: pink;"
                             aria-label="Pink"
                             data-type="pink"></div>
                        <div class="rounded-circle color-ball-marker"
                             style="width: 25px; height: 25px; background-color: black;"
                             aria-label="Black"
                             data-type="black"></div>
                    </div>
                </div>
            </div>
            <div class="mt-4"></div>
            <h5>Max Possible Break: <span id="max-possible-break">147</span></h5>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-12 text-center">
            <h4>Match Duration:</h4>
            <div id="match-timer">00:00:00</div>
            <div class="mt-2">
                <div class="btn-group" role="group">
                    <button class="btn btn-success" onclick="startTimer()">Start</button>
                    <button class="btn btn-warning" onclick="pauseTimer()">Pause</button>
                    <button class="btn btn-danger" onclick="stopTimer()">Stop</button>
                    <button class="btn btn-secondary" onclick="resetGame()">Reset Game</button>
                </div>
            </div>
        </div>
    </div>
</div>
</div>

<div class="modal fade" id="foulModal" tabindex="-1" role="dialog" aria-labelledby="foulModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="foulModalLabel">Select Foul Points</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <h6>Select Foul Points:</h6>
                    <button class="btn btn-primary foul-points" data-points="4">4 points</button>
                    <button class="btn btn-primary foul-points" data-points="5">5 points</button>
                    <button class="btn btn-primary foul-points" data-points="6">6 points</button>
                    <button class="btn btn-primary foul-points" data-points="7">7 points</button>
                </div>
                <div class="mb-3">
                    <h6>Choose Next Player:</h6>
                    <button class="btn btn-outline-primary next-player" data-player="1">Player 1</button>
                    <button class="btn btn-outline-primary next-player" data-player="2">Player 2</button>
                </div>
                <p class="mt-3">Manually adjust red balls:</p>
                <div class="input-group">
                    <input type="number" id="redBallAdjustment" class="form-control" min="0" max="15" placeholder="0">
                    <div class="input-group-append">
                        <button class="btn btn-outline-secondary" id="decreaseRedBalls">-</button>
                        <button class="btn btn-outline-secondary" id="increaseRedBalls">+</button>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-success" id="confirmFoul">OK</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{% static 'js/game_script.js' %}"></script>
{% endblock %}
