{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-5 text-center">
                <i class="bi bi-send-check display-4 text-success mb-3"></i>
                <h3 class="fw-bold mb-3">Email Sent!</h3>
                <p class="text-muted mb-4">
                    We've emailed you instructions for setting your password.
                    Check your inbox (and spam folder).
                </p>
                <div class="alert alert-warning small">
                    <i class="bi bi-info-circle me-1"></i> Since we are testing locally,
                    <strong>check your Terminal/Console</strong> for the link!
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
