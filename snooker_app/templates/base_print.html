<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Print Preview{% endblock %}</title>
    {# Prosty CSS bez Bootstrapa, żeby mieć pełną kontrolę nad papierem #}
    <style>
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 12pt;
            line-height: 1.4;
            color: #000;
            background: #fff;
            margin: 0;
            padding: 0;
        }

        h1, h2, h3 { margin-bottom: 10px; margin-top: 5px; }
        .text-center { text-align: center; }
        .fw-bold { font-weight: bold; }
        .mb-4 { margin-bottom: 1.5rem; }

        /* TABELE */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #000;
            padding: 6px 8px;
            text-align: left;
            vertical-align: middle;
        }
        th {
            background-color: #f0f0f0 !important; /* Szary nagłówek, drukarki to lubią */
            font-weight: bold;
            -webkit-print-color-adjust: exact; /* Wymusza druk tła */
            print-color-adjust: exact;
        }

        /* MAGIA DRUKU */
        @media print {
            @page {
                margin: 1cm;
                size: A4 portrait; /* Pionowo */
            }
            body { margin: 0; }

            /* Powtarzaj nagłówki tabeli na nowej stronie */
            thead { display: table-header-group; }

            /* Nie tnij wiersza w połowie */
            tr { break-inside: avoid; }

            /* Ukryj przyciski na wydruku */
            .no-print { display: none; }
        }
    </style>
</head>
<body>
    <div class="no-print" style="padding: 10px; background: #eee; border-bottom: 1px solid #ccc; text-align: center;">
        <button onclick="window.print()" style="font-size: 16px; padding: 5px 20px; cursor: pointer;">🖨️ Print Now</button>
        <button onclick="window.close()" style="font-size: 16px; padding: 5px 20px; cursor: pointer;">❌ Close</button>
    </div>

    <div style="padding: 0 10px;">
        {% block content %}{% endblock %}
    </div>

    {# Automatyczne wywołanie druku po załadowaniu #}
    <script>
        window.onload = function() {
            // Odkomentuj linię niżej, jeśli chcesz żeby drukarka wyskakiwała automatycznie
            window.print();
        };
    </script>
</body>
</html>
